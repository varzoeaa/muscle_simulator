<!doctype html>
<html lang="hu" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MuscleLab – interaktív anatómiai és biomechanikai oktatási alkalmazás" />
    <meta name="theme-color" content="#171419" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <title>MuscleLab – Interactive Anatomy & Biomechanics</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('musclelab:settings') || '{}');
        var theme = (t.state && t.state.theme) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>A MuscleLab futtatásához JavaScript szükséges.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
